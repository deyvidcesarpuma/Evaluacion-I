<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Mi tarjeta</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <!-- TARJETA: la caja grande azul -->
  <div class="tarjeta">

    <!-- ---------- DECORACIÓN ---------- -->
    <div class="triangulo grande"></div>
    <div class="triangulo mediano"></div>
    <div class="triangulo chico"></div>
    <div class="borde-seguridad"></div>

    <!-- ---------- LOGO ---------- -->
    <div class="circulo uno"></div>
    <div class="circulo dos"></div>

    <!-- ---------- CHIP (ahora es una imagen) ----------
         <img> es la etiqueta para poner imágenes. No lleva cierre.
         src = el nombre del archivo de la imagen
         alt = texto que describe la imagen (por si no carga) -->
    <img class="chip" src="chip.png" alt="Chip de la tarjeta">

    <!-- Señal sin contacto -->
    <div class="arco a1"></div>
    <div class="arco a2"></div>
    <div class="arco a3"></div>

    <!-- ---------- TEXTOS ---------- -->
    <div class="numero">**** **** **** <span>1234</span></div>
    <div class="emisor">EMISOR</div>
    <div class="nombre">NOMBRES Y APELLIDOS</div>
    <div class="vence"><small>VALID<br>THRU</small> 12/28</div>
    <div class="tipo">CARD TYPE</div>

  </div>

</body>
</html>
